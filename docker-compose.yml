name: noc-thz

services:
  influxdb:
    image: influxdb:2.7
    restart: unless-stopped
    container_name: noc-thz-influxdb
    ports: ["127.0.0.1:18086:8086"]
    volumes: [influx:/var/lib/influxdb2]
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}

  telegraf:
    image: telegraf:1.32
    restart: unless-stopped
    container_name: noc-thz-telegraf
    ports: ["127.0.0.1:18186:8186"]
    environment:
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
      ROUTER_IP: ${ROUTER_IP}
      SNMP_COMMUNITY: ${SNMP_COMMUNITY}
    volumes: ["./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro"]
    depends_on: [influxdb]

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    container_name: noc-thz-grafana
    ports: ["127.0.0.1:13000:3000"]
    volumes: [grafana:/var/lib/grafana]

networks:
  default:
    ipam:
      config:
        - subnet: 192.168.130.0/24

volumes:
  influx: {}
  grafana: {}