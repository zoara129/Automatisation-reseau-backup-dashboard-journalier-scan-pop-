[agent]
  interval = "60s"
  hostname = "noc-thz"
  
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"

[[inputs.http_listener_v2]]
  service_address = ":8186"
  paths = ["/telegraf"]
  data_format = "influx"

[[inputs.snmp]]
  agents = ["udp://${ROUTER_IP}:161"]
  version = 2
  community = "${SNMP_COMMUNITY}"
  timeout = "10s"
  retries = 2
  name = "router"
  agent_host_tag = "router"

  [[inputs.snmp.field]]
    oid = "1.3.6.1.2.1.1.3.0"
    name = "uptime"

  [[inputs.snmp.field]]
    oid = "1.3.6.1.2.1.1.5.0"
    name = "sysname"
    is_tag = true

  [[inputs.snmp.table]]
    name = "interface"
    index_as_tag = true

    [[inputs.snmp.table.field]]
      oid = "1.3.6.1.2.1.31.1.1.1.1"
      name = "ifName"
      is_tag = true
    [[inputs.snmp.table.field]]
      oid = "1.3.6.1.2.1.31.1.1.1.6"
      name = "ifHCInOctets"
    [[inputs.snmp.table.field]]
      oid = "1.3.6.1.2.1.31.1.1.1.10"
      name = "ifHCOutOctets"
    [[inputs.snmp.table.field]]
      oid = "1.3.6.1.2.1.31.1.1.1.15"
      name = "ifHighSpeed"
    [[inputs.snmp.table.field]]
      oid = "1.3.6.1.2.1.2.2.1.7"
      name = "ifAdminStatus"
    [[inputs.snmp.table.field]]
      oid = "1.3.6.1.2.1.2.2.1.8"
      name = "ifOperStatus"
    [[inputs.snmp.table.field]]
      oid = "1.3.6.1.2.1.31.1.1.1.18"
      name = "ifAlias"
    [[inputs.snmp.table.field]]
      oid = "1.3.6.1.2.1.2.2.1.14"
      name = "ifInErrors"
    [[inputs.snmp.table.field]]
      oid = "1.3.6.1.2.1.2.2.1.20"
      name = "ifOutErrors"